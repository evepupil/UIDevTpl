<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UIDevTpl：为 AI 编程提供可预览、可迁移的精选 UI 模板。" />
    <title>UIDevTpl - 模板库</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./vendor/lucide.min.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" data-home><span class="brand-mark">UI</span><span>UIDevTpl</span></a>

      <nav class="main-nav" aria-label="主导航">
        <div class="nav-menu-wrap">
          <button class="nav-button is-active" id="templates-menu-button" type="button" aria-expanded="false">
            <span data-copy="templates">模板</span><i data-lucide="chevron-down"></i>
          </button>
          <div class="templates-menu" id="templates-menu" hidden></div>
        </div>
        <button class="nav-button" type="button" data-placeholder="ai" data-copy="useAi">与 AI 使用</button>
      </nav>

      <div class="header-actions">
        <button class="share-button" type="button" data-placeholder="share"><i data-lucide="plus"></i><span data-copy="share">分享模板</span></button>
        <button class="icon-button" id="language-button" type="button" aria-label="Switch language" title="Switch language"><i data-lucide="languages"></i></button>
        <button class="icon-button" id="theme-button" type="button" aria-label="切换主题" title="切换主题"><i data-lucide="moon"></i></button>
        <button class="login-button" type="button" data-placeholder="login" data-copy="login">登录</button>
        <button class="signup-button" type="button" data-placeholder="signup" data-copy="signup">注册</button>
      </div>
    </header>

    <main>
      <section id="home-view">
        <div class="hero shell">
          <p data-copy="eyebrow">CURATED UI SYSTEMS FOR AI BUILDERS</p>
          <h1 data-copy="title">为 AI 开发找到好界面</h1>
          <span data-copy="subtitle">浏览经过打磨的组件、页面与完整模板，让 AI 从真实代码延续同一套设计。</span>
          <label class="search-box">
            <i data-lucide="search"></i>
            <input id="search-input" type="search" autocomplete="off" placeholder="搜索模板、分类或视觉风格" />
            <kbd>Ctrl K</kbd>
          </label>
        </div>

        <section class="section shell" id="category-section">
          <div class="section-head">
            <h2 data-copy="categories">分类</h2>
            <button class="text-link" type="button" data-all-categories><span data-copy="browseAll">浏览全部</span><i data-lucide="arrow-right"></i></button>
          </div>
          <div class="category-strip" id="home-categories"></div>
        </section>

        <section class="section shell" id="featured-section">
          <div class="section-head"><h2 data-copy="featured">精选模板</h2></div>
          <div class="template-grid featured-grid" id="featured-grid"></div>
        </section>

        <section class="section all-section shell">
          <div class="library-toolbar">
            <div><h2 data-copy="allTemplates">全部模板</h2><span id="result-count"></span></div>
            <label class="sort-control"><select id="sort-select"><option value="popular" data-copy="popular">热门排序</option><option value="newest" data-copy="newest">最新分享</option><option value="name" data-copy="nameSort">名称排序</option></select><i data-lucide="chevron-down"></i></label>
          </div>
          <div class="template-grid" id="template-grid"></div>
          <div class="empty-state" id="empty-state" hidden><i data-lucide="search-x"></i><h2 data-copy="emptyTitle">没有匹配的模板</h2><p data-copy="emptyBody">换一个关键词试试。</p></div>
        </section>
      </section>

      <section class="categories-page shell" id="categories-view" hidden>
        <nav class="breadcrumb"><button type="button" data-home data-copy="templates">模板</button><i data-lucide="chevron-right"></i><span data-copy="categories">分类</span></nav>
        <div class="page-title"><h1 data-copy="categoryTitle">全部模板分类</h1><p data-copy="categorySubtitle">按产品用途浏览公开模板，每个分类都用代表页面展示视觉方向。</p></div>
        <div class="categories-grid" id="categories-grid"></div>
      </section>

      <section class="categories-page shell" id="category-view" hidden>
        <nav class="breadcrumb"><button type="button" data-home data-copy="templates">模板</button><i data-lucide="chevron-right"></i><button type="button" data-all-categories data-copy="categories">分类</button><i data-lucide="chevron-right"></i><span id="category-crumb"></span></nav>
        <div class="page-title category-title"><span id="category-icon"></span><div><h1 id="category-name"></h1><p id="category-description"></p></div></div>
        <div class="template-grid" id="category-template-grid"></div>
        <div class="empty-state" id="category-empty" hidden><i data-lucide="folder-open"></i><h2 data-copy="categoryEmpty">这个分类正在整理</h2><p data-copy="categoryEmptyBody">公开模板通过审核后会出现在这里。</p></div>
      </section>
    </main>

    <dialog class="detail-dialog" id="detail-dialog">
      <button class="dialog-close icon-button" type="button" data-close aria-label="关闭"><i data-lucide="x"></i></button>
      <div class="detail-preview" id="detail-preview"></div>
      <div class="detail-content">
        <div class="detail-author" id="detail-author"></div>
        <h2 id="detail-title"></h2>
        <p id="detail-summary"></p>
        <div class="detail-meta"><span>React</span><span>HeroUI</span><span>TypeScript</span></div>
        <div class="detail-actions"><button class="secondary-action" type="button" data-placeholder="preview"><i data-lucide="external-link"></i><span data-copy="preview">查看预览</span></button><button class="primary-action" type="button" data-placeholder="ai"><i data-lucide="copy"></i><span data-copy="copyAi">复制给 AI</span></button></div>
      </div>
    </dialog>

    <dialog class="placeholder-dialog" id="placeholder-dialog">
      <span><i data-lucide="sparkles"></i></span><h2 id="placeholder-title"></h2><p id="placeholder-body"></p><button class="primary-action" type="button" data-close data-copy="gotIt">知道了</button>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"><i data-lucide="check"></i><span id="toast-text"></span></div>
  </body>
</html>
